# iOS 앱을 빌드해서 TestFlight에 올린다.
# 화면(index.html)만 바꾼 경우는 Render 배포로 바로 반영되니 이걸 돌릴 필요 없다.
# 아이콘·플러그인·권한·capacitor.config.json 같은 네이티브 부분을 바꿨을 때만 돌린다.
#
# 실행: GitHub 저장소 > Actions > "iOS TestFlight 업로드" > Run workflow
#   또는 ios-v1.0.1 같은 태그를 push
#
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions)
#   APP_STORE_CONNECT_KEY_ID     : App Store Connect API 키 ID
#   APP_STORE_CONNECT_ISSUER_ID  : 발급자(Issuer) ID
#   APP_STORE_CONNECT_API_KEY    : 내려받은 AuthKey_XXXX.p8 파일 내용 전체
name: iOS TestFlight 업로드

on:
  workflow_dispatch:
    inputs:
      version:
        description: '앱 버전 (비워두면 Xcode에 적힌 버전 그대로, 예: 1.0.1)'
        required: false
        default: ''
  push:
    tags:
      - 'ios-v*'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 웹 빌드 + 검사 + iOS 동기화
        run: |
          # www는 git에 안 올라가서 새로 받은 저장소엔 폴더가 없다
          mkdir -p www
          npm run build
          npm test
          npx cap sync ios

      - name: API 키 파일 만들기
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          RAW_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # 폰에서 붙여넣으면 앞뒤에 공백·줄바꿈이 붙을 수 있어서 지운다
          KEY_ID=$(printf '%s' "$RAW_KEY_ID" | tr -d ' \t\r\n')
          ISSUER_ID=$(printf '%s' "$RAW_ISSUER_ID" | tr -d ' \t\r\n')
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$ISSUER_ID"
          if ! [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID 형식이 틀려요(지금 ${#KEY_ID}글자). AuthKey_ 뒤 영문 대문자·숫자 10글자만 넣어 주세요."
            exit 1
          fi
          if ! [[ "$ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::APP_STORE_CONNECT_ISSUER_ID 형식이 틀려요(지금 ${#ISSUER_ID}글자). App Store Connect API 화면 맨 위 Issuer ID(하이픈 4개, 36글자)를 넣어 주세요."
            exit 1
          fi
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          # 폰에서 붙여넣으면 줄바꿈이 빠지거나 BEGIN/END 줄이 없을 수 있어서, 키 본문만 뽑아 PEM 형식으로 다시 만든다
          BODY=$(printf '%s' "$APP_STORE_CONNECT_API_KEY" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          {
            echo '-----BEGIN PRIVATE KEY-----'
            printf '%s' "$BODY" | fold -w 64
            echo
            echo '-----END PRIVATE KEY-----'
          } > "$RUNNER_TEMP/keys/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_API_KEY 값이 올바른 .p8 키가 아니에요. AuthKey_XXXX.p8 파일 내용 전체를 다시 넣어 주세요."
            exit 1
          fi

      - name: Apple 로그인 확인
        run: |
          # 키 세 개가 짝이 맞는지 App Store Connect API를 직접 불러서 확인한다
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          TOKEN=$(python3 -c "
          import jwt, time, os
          key = open(os.environ['RUNNER_TEMP'] + '/keys/AuthKey.p8').read()
          now = int(time.time())
          print(jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID']}))
          ")
          echo "::add-mask::$TOKEN"
          CODE=$(curl -s -o "$RUNNER_TEMP/asc.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'https://api.appstoreconnect.apple.com/v1/apps?limit=1')
          if [ "$CODE" != "200" ]; then
            cat "$RUNNER_TEMP/asc.json"; echo
            echo "::error::Apple 로그인 실패($CODE). 키 ID·Issuer ID·.p8 파일이 같은 키에서 나온 건지, 개인 키가 아니라 '팀 키'인지 확인해 주세요."
            exit 1
          fi
          echo "Apple 로그인 확인 완료"

      - name: 빌드 번호·버전 정하기
        id: ver
        run: |
          # 빌드 번호는 매번 커져야 업로드된다. 시각(년월일시분)을 써서 손으로 올린 빌드와도 겹치지 않게 한다.
          echo "build=$(date -u +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF_NAME" == ios-v* ]]; then
            VERSION="${GITHUB_REF_NAME#ios-v}"
          fi
          if [ -n "$VERSION" ]; then
            echo "version_arg=MARKETING_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: 아카이브
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            ${{ steps.ver.outputs.version_arg }}

      - name: TestFlight로 업로드
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>Z86JLY6SML</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "빌드 ${{ steps.ver.outputs.build }} 업로드 완료. App Store Connect에서 처리되면 TestFlight에 나타나요." >> "$GITHUB_STEP_SUMMARY"

      - name: API 키 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
